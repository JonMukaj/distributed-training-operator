# Publishes the operator dashboard as a ConfigMap the Grafana sidecar
# (kube-prometheus-stack, label grafana_dashboard="1") hot-loads.
#   kubectl apply -k config/grafana        (done by `make monitoring-install`)
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: monitoring
generatorOptions:
  disableNameSuffixHash: true
  labels:
    grafana_dashboard: "1"
configMapGenerator:
- name: distributedtraining-operator-dashboard
  files:
  - distributedtraining-dashboard.json
