# ---------------------------------------------------------------------------
# Machine hourly costs per node (USD).
# Used by the solver to estimate cost and pick optimal topology.
# Namespace/name must match the operator flags:
#   --machine-costs-configmap=machine-costs
#   --machine-costs-namespace=distributed-training-system
# ---------------------------------------------------------------------------
apiVersion: v1
kind: ConfigMap
metadata:
  name: machine-costs
  namespace: distributed-training-system
data:
  # Keys are whatever spec.hardware.machineType holds: GCE machine types on GKE,
  # flavor names on Hyperstack. Values are on-demand USD per node-hour.

  # GKE (us-central1, approximate)
  c4-highcpu-8: "0.35"

  # Hyperstack flavors (console on-demand price, CANADA-1)
  n3-A100x1: "1.35"   # 1x A100-80G-PCIe, 28 vCPU, 120 GB RAM
  n3-L40x1: "1.00"    # 1x L40 48 GB, 28 vCPU, 58 GB RAM
  # Add CPU flavors (e.g. n1-cpu-small) only with their real price: a missing key
  # makes the solver fall back to a calibration run, a wrong price corrupts cost
  # estimates.