# times, hours per run. With 64 micro-batches per optimizer step the per-node
# compute (~7 s) is comparable to the AllReduce (~4 s at 2 nodes, ~6 s at 4), so eta
# spans a range the solver and the bottleneck classifier can actually discriminate.
# Same 40k samples per run; ~18 min of compute at 1 node, ~15/9 min at 2/4 nodes.
