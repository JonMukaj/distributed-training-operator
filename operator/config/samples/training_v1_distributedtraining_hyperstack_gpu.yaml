      - --save_strategy=no
      - --overwrite_output_dir=True
      - --do_train=True
      - --do_eval=True
      - --bf16=True
      - --ddp_backend=nccl
      - --ddp_find_unused_parameters=False   # Pythia uses every parameter each step; the Trainer's default True adds a graph walk per iteration
      - --dataloader_num_workers=2
      - --report_to=none
      - --profile_warmup_steps=3
    resources:                   # n3-L40x1: 28 vCPU / 58 GB; 405M full FT needs ~7 GB GPU + activations
      requests:
        cpu: "8"
        memory: "24Gi"
      limits:
        cpu: "8"
        memory: "24Gi"
        nvidia.com/gpu: "1"
    env:
      - name: HF_HOME
        value: /mnt/output/hf-cache
      - name: HF_HUB_DISABLE_XET
        value: "1"
      - name: NCCL_DEBUG
        value: INFO
---
# ---------------------------------------------------------------------------
# Chapter 5 - solver run C: three-point fit, intermediate target
#
# Same workload, dataset, batch, accumulation and epochs as the e2-n* CRs, so the
# config hash matches and the solver reads their history. No spec.topology: the solver
# resolves nodes (never fewer than 2) and the result is a normal history entry too.
#
# Run after run B. Choose targetTime so the fitted model picks an unmeasured count between
# measured ones (3, 4 or 6), so the prediction is checked out of sample. The cost saving vs
# naive provisioning is this run's cost against e2-n10's (same work, maxNodes 10).
# ---------------------------------------------------------------------------
apiVersion: training.distributedtraining.io/v1
kind: DistributedTraining
metadata:
  name: obj-e2-mid
  labels:
    experiment: obj-e2-mid
    series: c5
spec:
  backend: pytorch
  hardware:
    type: gpu
    machineType: n3-L40x1
    nodePoolName: dj-oe2-mid
  objective:                         # no explicit topology: the solver resolves it
    targetTime: "12m"   # PROVISIONAL - set with script/solver_whatif.py, see header
    maxNodes: 10
  outputPVCName: distributed-training-output-pvc
  model:
    name: EleutherAI/pythia-410m
    trainingScript: /workspace/scripts/finetune.py
  dataset:
    name: wikitext/wikitext-103-raw-v1
    split: train
  training:
    batchSize: 4
    learningRate: "2e-5"
    epochs: 1
    maxSteps: -1
    gradAccumulationSteps: 64
    ddpBackend: nccl
  optimization:
    mixedPrecision: bf16
    lora:
      enabled: false
  pytorchSpec:
    image: jmukaj/gpu-fine-tuner-hf:v2.6.0
    command:
      - torchrun
      - --nproc_per_node=1
      - --nnodes=$(WORLD_SIZE)
      - --node_rank=$(RANK)
      - --master_addr=$(MASTER_ADDR)
      - --master_port=23456
      - /workspace/scripts/finetune.py
      - --model_name_or_path=EleutherAI/pythia-410m
      - --output_dir=/mnt/output/checkpoints
      - --dataset_name=wikitext
      - --dataset_config_name=wikitext-103-raw-v1
      - --dataset_cache_directory=/mnt/output/hf-cache/datasets-packed512   # tokenised cache on the PVC
      - --pack_text=true
      - --max_seq_length=512
      - --max_train_samples=35840          # fixed total work; identical at 1/2/5/7/10 nodes
      - --max_eval_samples=1000
      - --validation_split_percentage=0.2
      - --use_lora=false
      - --per_device_train_batch_size=4
      - --per_device_eval_batch_size=8
      - --learning_rate=2e-5
      - --num_train_epochs=1
      - --max_steps=-1
      - --gradient_accumulation_steps=64
      - --max_grad_norm=1.0
      - --warmup_ratio=0.1
      - --logging_steps=5
      - --save_strategy=no
      - --overwrite_output_dir=True
      - --do_train=True
      - --do_eval=True
      - --bf16=True
      - --ddp_backend=nccl
      - --ddp_find_unused_parameters=False   # Pythia uses every parameter each step; the Trainer's default True adds a graph walk per iteration
      - --dataloader_num_workers=2
      - --report_to=none
      - --profile_warmup_steps=3           # each optimizer step is 64 micro-batches (~7 s); 3 is ample CUDA warm-up
    resources:                   # n3-L40x1: 28 vCPU / 58 GB; 405M full FT needs ~7 GB GPU + activations
      requests:
        cpu: "8"
        memory: "24Gi"
      limits:
        cpu: "8"
        memory: "24Gi"
        nvidia.com/gpu: "1"
    env:
      - name: HF_HOME
        value: /mnt/output/hf-cache
      - name: HF_HUB_DISABLE_XET
        value: "1"
      - name: NCCL_DEBUG
        value: INFO
