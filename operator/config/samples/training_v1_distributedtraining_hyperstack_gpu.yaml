# ---------------------------------------------------------------------------
# machine-costs ConfigMap (objective mode only): config/samples/machine-costs-configmap.yaml
# carries both flavors at their console on-demand prices (n3-L40x1 $1.00/h,
# n3-A100x1 $1.35/h). `make hs-build-deploy` / `hs-reset-cr` apply the ConfigMap;
# after editing it re-apply with
#   kubectl apply -f config/samples/machine-costs-configmap.yaml
---
# ---------------------------------------------------------------------------
# e1-n1: Pythia-410M FULL fine-tuning, 1 node — AllReduce overhead in isolation (random tokens, no storage reads).
#
# pytorchSpec.command is set because the operator's default torchrun builder
# cannot express --use_lora false, --synthetic_samples or a dataset config name.
# The spec.model/dataset/training fields are still filled in: they form the
# config hash that groups the E1 runs (1/2/4 nodes) into one history series,
# distinct from the other series. Keep them identical across the three CRs.
#
# Why full fine-tuning: under LoRA only ~61k adapter params are reduced (368 kB
# per step) and AllReduce is ~0.4% of the step; with all 405M params in fp32
# master weights the gradient is ~1.6 GB per step, which is the communication
# cost the thesis measures. Expect `bottleneck` to move from compute-bound
# toward communication-bound as nodes increase.
# Gradient accumulation 64 (effective batch 256): measured 2026-11-05 without it, a
# 1.6 GB AllReduce per 4-sample micro-batch on this ~3 Gbit/s interconnect made 4
# nodes 45x slower per step than 1 (eta 0.02, alpha ~14) — one finding repeated four
# times, hours per run. With 64 micro-batches per optimizer step the per-node
# compute (~7 s) is comparable to the AllReduce (~4 s at 2 nodes, ~6 s at 4), so eta
# spans a range the solver and the bottleneck classifier can actually discriminate.
# Same 40k samples per run; ~18 min of compute at 1 node, ~15/9 min at 2/4 nodes.
# ---------------------------------------------------------------------------
apiVersion: training.distributedtraining.io/v1
kind: DistributedTraining
metadata:
  name: e1-n1-pythia410m
  labels:
    experiment: e1-n1
    series: e1
spec:
  backend: pytorch
  hardware:
    type: gpu
    machineType: n3-L40x1
    nodePoolName: dj-e1-n1             # ≤ 20 chars, unique per CR
  topology:
    nodes: 1
    processesPerNode: 1
  outputPVCName: distributed-training-output-pvc
  model:
    name: EleutherAI/pythia-410m
    trainingScript: /workspace/scripts/finetune.py
  dataset:
    name: synthetic
    split: train
  training:
    batchSize: 4
    learningRate: "2e-5"
    epochs: 1
    maxSteps: -1
    gradAccumulationSteps: 64
    ddpBackend: nccl
  optimization:
    mixedPrecision: bf16
    lora:
      enabled: false
  pytorchSpec:
    image: jmukaj/gpu-fine-tuner-hf:v2.3.0
    command:
      - torchrun
      - --nproc_per_node=1
      - --nnodes=$(WORLD_SIZE)
      - --node_rank=$(RANK)
      - --master_addr=$(MASTER_ADDR)
      - --master_port=23456
      - /workspace/scripts/finetune.py
      - --model_name_or_path=EleutherAI/pythia-410m
      - --output_dir=/mnt/output/checkpoints
      - --dataset_name=synthetic
      - --synthetic_samples=40000          # fixed total work; identical at 1/2/4 nodes
      - --synthetic_seq_len=512
      - --validation_split_percentage=0.2
      - --use_lora=false
      - --per_device_train_batch_size=4
      - --per_device_eval_batch_size=8
      - --learning_rate=2e-5
      - --num_train_epochs=1
      - --max_steps=-1
      - --gradient_accumulation_steps=64   # see header: shrinks AllReduces per sample 64x so the series sits in a measurable scaling regime
      - --max_grad_norm=1.0
      - --warmup_ratio=0.1                 # few optimizer steps now (156/78/39); a fixed 50 would exceed them
      - --logging_steps=5
      - --save_strategy=no
      - --overwrite_output_dir=True
      - --do_train=True
      - --do_eval=True
      - --bf16=True
      - --ddp_backend=nccl
      - --ddp_find_unused_parameters=False   # Pythia uses every parameter each step; the Trainer's default True adds a graph walk per iteration
      - --dataloader_num_workers=2
      - --report_to=none
      - --profile_warmup_steps=3           # each optimizer step is 64 micro-batches (~7 s); 3 is ample CUDA warm-up
    resources:                   # n3-L40x1: 28 vCPU / 58 GB; 405M full FT needs ~7 GB GPU + activations
      requests:
        cpu: "8"
        memory: "24Gi"
      limits:
        cpu: "8"
        memory: "24Gi"
        nvidia.com/gpu: "1"
    env:
      - name: HF_HOME
        value: /mnt/output/hf-cache
      - name: HF_HUB_DISABLE_XET
        value: "1"
      - name: NCCL_DEBUG
        value: WARN
---
