apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Inherits CRDs, RBAC, manager base, and metrics (incl. the plain-HTTP metrics
# Service on 8080 that config/monitoring scrapes) from config/default.
resources:
- ../../default

patches:
# Inject Hyperstack-specific flags and the API-key env var into the manager.
- path: manager_args_patch.yaml
  target:
    kind: Deployment
    name: controller-manager
