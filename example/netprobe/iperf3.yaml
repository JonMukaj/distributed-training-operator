# Pod-to-pod network bandwidth probe (iperf3), two pods forced onto different
# nodes. Gives the thesis a measured inter-node figure instead of one inferred
# from AllReduce step times.
#
#   make netprobe                       # apply, wait, print Gbit/s, clean up
#   make netprobe NODE_GROUP=dj-e1-n2   # pin both pods to a specific node group
#                                       #   (e.g. while a 2-node job's GPU nodes exist)
#
# Default placement: any two distinct nodes that match NODE_SELECTOR (the base
# worker group). Hyperstack's GPU and CPU flavors share the same virtual network,
# but measure on the GPU group once if you want to be sure.
apiVersion: v1
kind: Service
metadata:
  name: iperf3-server
  namespace: default
spec:
  selector:
    app: iperf3
    role: server
  ports:
    - port: 5201
      targetPort: 5201
---
apiVersion: v1
kind: Pod
metadata:
  name: iperf3-server
  namespace: default
  labels: {app: iperf3, role: server}
spec:
  restartPolicy: Never
  nodeSelector:
    hyperstack.cloud/node-group-name: default   # replaced by `make netprobe NODE_GROUP=…`
  containers:
    - name: iperf3
      image: networkstatic/iperf3:latest
      args: ["-s"]
      ports: [{containerPort: 5201}]
---
apiVersion: v1
kind: Pod
metadata:
  name: iperf3-client
  namespace: default
  labels: {app: iperf3, role: client}
spec:
  restartPolicy: Never
  nodeSelector:
    hyperstack.cloud/node-group-name: default   # replaced by `make netprobe NODE_GROUP=…`
  affinity:
    podAntiAffinity:                             # never on the server's node
      requiredDuringSchedulingIgnoredDuringExecution:
        - topologyKey: kubernetes.io/hostname
          labelSelector:
            matchLabels: {app: iperf3, role: server}
  initContainers:
    - name: wait-for-server
      image: busybox:1.36
      command: ["sh", "-c", "until nc -z iperf3-server 5201; do sleep 1; done"]
  containers:
    - name: iperf3
      image: networkstatic/iperf3:latest
      # 4 parallel streams, 20 s, both directions, JSON for parsing
      command: ["sh", "-c",
        "iperf3 -c iperf3-server -t 20 -P 4 -J > /tmp/up.json && iperf3 -c iperf3-server -t 20 -P 4 -R -J > /tmp/down.json && cat /tmp/up.json /tmp/down.json"]
