# Hyperstack variant of nfs.yaml.
#
# GKE mounts the NFS server's disk via an inline `gcePersistentDisk` reference to
# the Terraform-created `nfs-disk`. Hyperstack has no in-tree volume driver, so
# the backing disk is a dynamic RWO PVC provisioned by the Hyperstack CSI driver
# (install once per cluster):
#
#   helm repo add nexgencloud https://nexgencloud.github.io/csi-hyperstack
#   helm install csi-hyperstack nexgencloud/csi-hyperstack \
#     --namespace kube-system --set hyperstack.apiKey=$HYPERSTACK_API_KEY
#
# The NFS server then re-exports the RWO volume as RWX, exactly as on GKE.
---
# Retain so the dataset disk survives PVC/cluster teardown (mirrors the
# standalone google_compute_disk on GCP; the default csi-hyperstack class is Delete).
#
# Teardown order matters: delete this workload (so CSI detaches the volume →
# AVAILABLE) BEFORE destroying the cluster. If the node VMs are deleted while the
# volume is still attached, it gets stuck in Hyperstack's RESERVED state (still
# billed). With Retain, deleting the PVC detaches but does not delete the volume —
# remove it from the Hyperstack Volumes page when the dataset is no longer needed.
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: nfs-retain
provisioner: hyperstack.csi.nexgencloud.com
parameters:
  type: Cloud-SSD
reclaimPolicy: Retain
volumeBindingMode: Immediate
allowVolumeExpansion: true
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: nfs-disk
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: nfs-retain
  resources:
    requests:
      storage: 50Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nfs-server
spec:
  replicas: 1
  selector:
    matchLabels:
      role: nfs-server
  template:
    metadata:
      labels:
        role: nfs-server
    spec:
      containers:
      - name: nfs-server
        image: coolersport/volume-nfs:0.8
        ports:
          - name: nfs
            containerPort: 2049
          - name: mountd
            containerPort: 20048
          - name: rpcbind
            containerPort: 111
        securityContext:
          privileged: true
        volumeMounts:
          - mountPath: /exports
            name: nfs-pvc
        command:
          - /bin/sh
          - -c
          - |
            mkdir -p /exports/medical-meadow
            chmod -R 777 /exports
            echo "/exports *(rw,sync,no_subtree_check,no_root_squash,fsid=0)" > /etc/exports
            echo "/exports/medical-meadow *(rw,sync,no_subtree_check,no_root_squash)" >> /etc/exports
            /usr/sbin/rpcbind
            /usr/sbin/rpc.nfsd
            /usr/sbin/exportfs -r
            /usr/sbin/rpc.mountd -F
      volumes:
        - name: nfs-pvc
          persistentVolumeClaim:
            claimName: nfs-disk
---
apiVersion: v1
kind: Service
metadata:
  name: nfs-server
spec:
  ports:
    - name: nfs
      port: 2049
    - name: mountd
      port: 20048
    - name: rpcbind
      port: 111
  selector:
    role: nfs-server
