# Hyperstack variant of nfs.yaml.
#
# GKE mounts the NFS server's disk via an inline `gcePersistentDisk` reference to
# the Terraform-created `nfs-disk`. Hyperstack has no in-tree volume driver, so
# the backing disk is a dynamic RWO PVC provisioned by the Hyperstack CSI driver
# (install once per cluster):
#
#   helm repo add nexgencloud https://nexgencloud.github.io/csi-hyperstack
#   helm install csi-hyperstack nexgencloud/csi-hyperstack \
#     --namespace kube-system --set hyperstack.apiKey=$HYPERSTACK_API_KEY
#
# The NFS server then re-exports the RWO volume as RWX, exactly as on GKE.
---
# reclaimPolicy Delete: deleting the nfs-disk PVC deletes the Hyperstack volume
# too, so nothing keeps billing after teardown. The data on it (HF cache,
# checkpoints, archived results) is therefore gone with the PVC — run
# `make archive-results` for every run first (see README Step 7). Use Retain
# instead if the disk must outlive the cluster.
#
# Teardown order still matters: delete this workload (so CSI detaches and
# deletes the volume) BEFORE destroying the cluster. If the node VMs are deleted
# while the volume is still attached, it gets stuck in Hyperstack's RESERVED
# state (still billed) and must be removed from the Volumes page by hand.
#
# StorageClasses are immutable: to switch an existing cluster from the former
# `nfs-retain` class, delete that StorageClass, apply this one, and patch the
# already-provisioned PV (its policy was fixed at provisioning time):
#   kubectl patch pv $(kubectl get pvc nfs-disk -o jsonpath='{.spec.volumeName}') \
#     -p '{"spec":{"persistentVolumeReclaimPolicy":"Delete"}}'
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: nfs-hyperstack
provisioner: hyperstack.csi.nexgencloud.com
parameters:
  type: Cloud-SSD
reclaimPolicy: Delete
volumeBindingMode: Immediate
allowVolumeExpansion: true
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: nfs-disk
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: nfs-hyperstack
  resources:
    requests:
      storage: 50Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nfs-server
spec:
  replicas: 1
  selector:
    matchLabels:
      role: nfs-server
  template:
    metadata:
      labels:
        role: nfs-server
    spec:
      containers:
      - name: nfs-server
        image: coolersport/volume-nfs:0.8
        ports:
          - name: nfs
            containerPort: 2049
          - name: mountd
            containerPort: 20048
          - name: rpcbind
            containerPort: 111
        securityContext:
          privileged: true
        volumeMounts:
          - mountPath: /exports
            name: nfs-pvc
        command:
          - /bin/sh
          - -c
          - |
            mkdir -p /exports/medical-meadow
            chmod -R 777 /exports
            echo "/exports *(rw,sync,no_subtree_check,no_root_squash,fsid=0)" > /etc/exports
            echo "/exports/medical-meadow *(rw,sync,no_subtree_check,no_root_squash)" >> /etc/exports
            /usr/sbin/rpcbind
            /usr/sbin/rpc.nfsd
            /usr/sbin/exportfs -r
            /usr/sbin/rpc.mountd -F
      volumes:
        - name: nfs-pvc
          persistentVolumeClaim:
            claimName: nfs-disk
---
apiVersion: v1
kind: Service
metadata:
  name: nfs-server
spec:
  ports:
    - name: nfs
      port: 2049
    - name: mountd
      port: 20048
    - name: rpcbind
      port: 111
  selector:
    role: nfs-server
